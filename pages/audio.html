    <script>
        $(window).on("load", function () {
            GreenAudioPlayer.init({
                selector: '.audio-player',
                stopOthersOnPlay: true
            });
        });

        document.addEventListener("DOMContentLoaded", function () {
            document.querySelectorAll('.audio-player audio').forEach(function (audioEl) {
                const sourceUrl = audioEl.getAttribute('data-src');
                if (!sourceUrl) {
                    return;
                }

                const loadSource = function () {
                    if (audioEl.getAttribute('data-loaded') === 'true') {
                        return;
                    }

                    const sourceEl = document.createElement('source');
                    sourceEl.src = sourceUrl;
                    sourceEl.type = 'audio/mpeg';
                    audioEl.appendChild(sourceEl);
                    audioEl.setAttribute('data-loaded', 'true');
                    audioEl.load();
                };

                audioEl.addEventListener('play', loadSource, { once: true });
            });
        });
    </script>
