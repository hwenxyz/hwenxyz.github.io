<!doctype html>
<html lang="English" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://code.jquery.com/jquery-1.12.4.min.js"
    integrity="sha256-ZosEbRLbNQzLpnKIkEdrPv7lOy9C27hHQ+Xp8a4MxAQ=" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<link rel="stylesheet" href="/assets/css/style.css?v=">
<script src="/assets/js/script.js?v="></script></head>

<body>
  <script>
    (function () {
      function fallbackRedirect() {
        window.location.replace("/pages/categories.html");
      }

      function parsePostIdValue(post) {
        if (!post || typeof post !== "object") {
          return Number.POSITIVE_INFINITY;
        }

        var rawId = post.post_id;
        if (rawId === undefined || rawId === null || rawId === "") {
          rawId = post.id;
        }

        if (typeof rawId === "number" && Number.isFinite(rawId)) {
          return rawId;
        }

        if (typeof rawId === "string") {
          var trimmed = rawId.trim();
          if (!trimmed) {
            return Number.POSITIVE_INFINITY;
          }

          var numeric = Number(trimmed);
          if (Number.isFinite(numeric)) {
            return numeric;
          }

          var matches = trimmed.match(/\d+/g);
          if (matches && matches.length) {
            var extracted = Number(matches[matches.length - 1]);
            if (Number.isFinite(extracted)) {
              return extracted;
            }
          }
        }

        return Number.POSITIVE_INFINITY;
      }

      fetch("/assets/indexdb.json", { cache: "no-store" })
        .then(function (response) {
          if (!response.ok) {
            throw new Error("indexdb unavailable");
          }
          return response.json();
        })
        .then(function (indexdb) {
          var posts = indexdb && Array.isArray(indexdb.posts) ? indexdb.posts : [];
          if (!posts.length) {
            fallbackRedirect();
            return;
          }

          var postsByCategory = {};
          posts.forEach(function (post) {
            var category = post && post.category ? String(post.category).trim() : "";
            if (!category) {
              category = "未分类";
            }
            if (!postsByCategory[category]) {
              postsByCategory[category] = [];
            }
            postsByCategory[category].push(post);
          });

          var categories = Object.keys(postsByCategory);
          if (!categories.length) {
            fallbackRedirect();
            return;
          }

          var randomCategory = categories[Math.floor(Math.random() * categories.length)];
          var categoryPosts = postsByCategory[randomCategory];
          var targetPost = categoryPosts.reduce(function (best, current) {
            return parsePostIdValue(current) < parsePostIdValue(best) ? current : best;
          }, categoryPosts[0]);
          var targetUrl = targetPost && typeof targetPost.url === "string" ? targetPost.url.trim() : "";

          if (!targetUrl) {
            fallbackRedirect();
            return;
          }

          window.location.replace(targetUrl);
        })
        .catch(function () {
          fallbackRedirect();
        });
    })();
  </script>
</body>

</html>
